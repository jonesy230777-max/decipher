services:
  db:
    image: pgvector/pgvector:pg16
    container_name: decipher-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DECIPHER_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - decipher_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    image: axllent/mailpit:latest
    container_name: decipher-mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DECIPHER_MAIL_PORT}:8025"   # web UI
      - "127.0.0.1:1025:1025"                    # SMTP (host port pinned for simplicity)
    environment:
      MP_MAX_MESSAGES: 5000

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: decipher-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DECIPHER_WEB_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database: connect via Docker service name, not localhost
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DECIPHER_DB_HOST: db
      DECIPHER_DB_PORT: 5432   # inside Docker network; always 5432
      # API keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      AUDIT_PRICE_AUD: ${AUDIT_PRICE_AUD:-497}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      # Mail
      MAIL_FROM: ${MAIL_FROM:-audit@decipher.local}
      # CORS: set to your public domain in production
      DECIPHER_WEB_ORIGIN: ${DECIPHER_WEB_ORIGIN:-http://localhost:${DECIPHER_WEB_PORT}}
    volumes:
      - decipher_exports:/app/_squarespace_exports
      - decipher_backups:/app/var/backups
    networks:
      - default
    # Override the db host: inside the Docker network use the service name
    # The app connects via: postgresql://user:pass@db:5432/decipher
    # api_server.py uses DECIPHER_DB_PORT to construct the DSN. Set to 5432 above.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  decipher_pgdata:
  decipher_exports:
  decipher_backups:
