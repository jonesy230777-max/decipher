[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# -----------------------------------------------------------------------
# nginx: serves static dashboard + proxies /api/ to uvicorn
# -----------------------------------------------------------------------
[program:nginx]
command=nginx -c /app/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log

# -----------------------------------------------------------------------
# uvicorn: FastAPI API server
# -----------------------------------------------------------------------
[program:api]
command=uvicorn app.api_server:app --host 127.0.0.1 --port 8000 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log
environment=
    ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",
    POSTGRES_DB="%(ENV_POSTGRES_DB)s",
    POSTGRES_USER="%(ENV_POSTGRES_USER)s",
    POSTGRES_PASSWORD="%(ENV_POSTGRES_PASSWORD)s",
    DECIPHER_DB_HOST="%(ENV_DECIPHER_DB_HOST)s",
    DECIPHER_DB_PORT="%(ENV_DECIPHER_DB_PORT)s",
    JWT_SECRET="%(ENV_JWT_SECRET)s",
    STRIPE_SECRET_KEY="%(ENV_STRIPE_SECRET_KEY)s",
    STRIPE_WEBHOOK_SECRET="%(ENV_STRIPE_WEBHOOK_SECRET)s",
    AUDIT_PRICE_AUD="%(ENV_AUDIT_PRICE_AUD)s",
    STRIPE_SUCCESS_URL="%(ENV_STRIPE_SUCCESS_URL)s",
    STRIPE_CANCEL_URL="%(ENV_STRIPE_CANCEL_URL)s",
    MAIL_FROM="%(ENV_MAIL_FROM)s",
    DECIPHER_WEB_ORIGIN="%(ENV_DECIPHER_WEB_ORIGIN)s",
    SQUARESPACE_EXPORT_DIR="/app/_squarespace_exports"
